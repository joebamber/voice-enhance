[project]
name = "voice-enhance"
version = "0.10.0"
description = "Local, Adobe-Podcast-style speech enhancement: AI denoise + broadcast polish + loudness normalisation."
readme = "README.md"
requires-python = ">=3.10,<3.12"  # DeepFilterLib has no 3.12 wheels
dependencies = [
    "deepfilternet==0.5.6",
    # deepfilternet 0.5.6 imports torchaudio.backend, removed in later torchaudio releases
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "numpy>=1.24,<2",
    "soundfile>=0.12",
    "scipy>=1.10",
    "tqdm>=4.66",
    # ClearerVoice-Studio: the MossFormer2 48 kHz rebuild.
    # Weights (~2 GB) download from Hugging Face on first use.
    "clearvoice>=0.1.2",
    # Sidon (--studio): its feature front end. Weights download from Hugging Face on first use.
    "transformers>=4.40",
    # Sidon's pitch follow (--follow-pitch): Praat's pitch tracker and PSOLA.
    "praat-parselmouth>=0.4.3",
    # StuPASE (--stupase): its flow-matching model (code vendored in stupase_model/).
    # Weights (~2.2 GB) download from Hugging Face on first use.
    "x-transformers==2.14.2",
    "torchdiffeq>=0.2.5",
    # AI dereverb (--ai-dereverb): its BS-Roformer (code vendored in roformer/).
    # Weights (~120 MB) download from Hugging Face on first use.
    "beartype>=0.18",
    "rotary-embedding-torch>=0.5",
    "einops>=0.7",
    "pyyaml>=6",
]

[project.optional-dependencies]
# kept so older install commands with [clearvoice] still work
clearvoice = []

[project.scripts]
voice-enhance = "voice_enhance.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_enhance"]
